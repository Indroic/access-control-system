name: access-control-system

services:
  postgres:
    image: postgres
    container_name: access-control-system-postgres
    environment:
      POSTGRES_DB: access-control-system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - access-control-system_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  access-control-system_postgres_data:

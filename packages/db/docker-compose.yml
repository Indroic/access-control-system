name: access-control-system

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: access-control-system-postgres
    environment:
      POSTGRES_DB: access-control-system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - access-control-system_postgres_data:/var/lib/postgresql
      - ../../docker/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d access-control-system"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  access-control-system_postgres_data:

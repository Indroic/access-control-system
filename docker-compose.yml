name: access-control-system

# ─── Shared anchors ──────────────────────────────────────────────────────────
# DATABASE_URL es OBLIGATORIA: apunta a un PostgreSQL (con pgvector) externo.
# Compose aborta con el mensaje indicado si no está definida en el entorno/.env.
x-database-url: &database-url ${DATABASE_URL:?DATABASE_URL es obligatoria (postgresql://usuario:clave@host:5432/db)}
x-public-server-url: &public-server-url http://localhost:3000

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ── Drizzle push (Better-Auth schema) — runs once, exits ──────────────────
  biometric-api-migrator:
    build:
      context: .
      dockerfile: apps/biometric-api/Dockerfile
    restart: "no"
    command: ["sh", "./scripts/migrate.sh"]
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
    networks:
      - dokploy-network

  # ── Alembic upgrade (biometric schema) — runs once, exits ─────────────────
  biometric-migrate:
    image: python:3.14-slim
    container_name: acs-biometric-migrate
    working_dir: /app
    command: >
      sh -c "
        pip install --quiet --no-cache-dir uv &&
        uv pip install --system
          alembic
          'sqlalchemy[asyncio]'
          psycopg2-binary
          hexcore
          pgvector
          pydantic-settings &&
        alembic upgrade head
      "
    environment:
      DATABASE_URL: *database-url
      HEXCORE_CONFIG_MODULE: "config"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps/biometric-api:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

    networks:
      - dokploy-network

  # ── Hono backend ──────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: acs-server
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: change-me-to-a-random-32-char-secret!!
      BETTER_AUTH_URL: *public-server-url
      BIOMETRIC_API_URL: http://biometric-api:8000
      CORS_ORIGIN: http://localhost:3001
      ADMIN_SETUP_SECRET: super-secret-admin-setup-key-123456
      INTERNAL_API_KEY: change-me-to-a-safe-internal-secret-key-12345!!
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dokploy-network

  # ── TanStack Start (Vite) frontend ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: acs-web
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_SERVER_URL: *public-server-url
      INTERNAL_API_KEY: change-me-to-a-safe-internal-secret-key-12345!!
      BIOMETRIC_API_URL: http://biometric-api:8000
    ports:
      - "3001:3001"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dokploy-network

  # ── Python biometric API ───────────────────────────────────────────────────
  biometric-api:
    build:
      context: .
      dockerfile: apps/biometric-api/Dockerfile
    container_name: acs-biometric
    environment:
      DATABASE_URL: *database-url
      HEXCORE_CONFIG_MODULE: "config"
      BETTER_AUTH_URL: http://server:3000/api/auth
      BETTER_AUTH_ISSUER: *public-server-url
      BETTER_AUTH_AUDIENCE: *public-server-url
      INTERNAL_API_KEY: change-me-to-a-safe-internal-secret-key-12345!!
    ports:
      - "8000:8000"
    volumes:
      # Cache InsightFace model files across restarts (~400 MB download)
      - insightface_models:/root/.insightface
    depends_on:
      biometric-migrate:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  # Red compartida de Dokploy (la crea Dokploy). Solo para el ingress de Traefik
  # del único servicio público: 'web'.
  dokploy-network:
    external: true


# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  insightface_models:
  migrate_node_modules:

name: access-control-system

# ─── Shared anchors ──────────────────────────────────────────────────────────
x-db-creds: &db-creds
  POSTGRES_DB: access-control-system
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password

x-database-url: &database-url postgresql://postgres:password@postgres:5432/access-control-system
x-async-database-url: &async-database-url postgresql+asyncpg://postgres:password@postgres:5432/access-control-system
x-public-server-url: &public-server-url http://localhost:3000

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg18
    container_name: acs-postgres
    environment:
      <<: *db-creds
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d access-control-system"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Drizzle push (Better-Auth schema) — runs once, exits ──────────────────
  migrate:
    image: node:22-alpine
    container_name: acs-migrate
    working_dir: /monorepo
    command: >
      sh -c "
        corepack enable &&
        pnpm install --frozen-lockfile &&
        pnpm --filter @access-control-system/db db:push
      "
    environment:
      CI: "true"
      DATABASE_URL: *database-url
    volumes:
      - .:/monorepo
      - migrate_node_modules:/monorepo/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Alembic upgrade (biometric schema) — runs once, exits ─────────────────
  biometric-migrate:
    image: python:3.14
    container_name: acs-biometric-migrate
    working_dir: /app
    command: >
      sh -c "
        pip install uv --quiet --disable-pip-version-check &&
        uv sync --frozen &&
        .venv/bin/alembic upgrade head
      "
    environment:
      SQL_DATABASE_URL: *database-url
      ASYNC_SQL_DATABASE_URL: *async-database-url
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps/biometric-api:/app
      - biometric_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # ── Hono backend ──────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: acs-server
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: change-me-to-a-random-32-char-secret!!
      BETTER_AUTH_URL: *public-server-url
      BIOMETRIC_API_URL: http://biometric-api:8000
      CORS_ORIGIN: http://localhost:3001
      ADMIN_SETUP_SECRET: super-secret-admin-setup-key-123456
      INTERNAL_API_KEY: change-me-to-a-safe-internal-secret-key-12345!!
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── TanStack Start (Vite) frontend ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: acs-web
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_SERVER_URL: *public-server-url
    ports:
      - "3001:3001"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # ── Python biometric API ───────────────────────────────────────────────────
  biometric-api:
    build:
      context: .
      dockerfile: apps/biometric-api/Dockerfile
    container_name: acs-biometric
    environment:
      SQL_DATABASE_URL: *database-url
      ASYNC_SQL_DATABASE_URL: *async-database-url
      BETTER_AUTH_URL: http://server:3000/api/auth
      BETTER_AUTH_ISSUER: *public-server-url
      BETTER_AUTH_AUDIENCE: *public-server-url
      INTERNAL_API_KEY: change-me-to-a-safe-internal-secret-key-12345!!
    ports:
      - "8000:8000"
    volumes:
      # Cache InsightFace model files across restarts (~400 MB download)
      - insightface_models:/root/.insightface
    depends_on:
      postgres:
        condition: service_healthy
      biometric-migrate:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  insightface_models:
  migrate_node_modules:
  biometric_venv:

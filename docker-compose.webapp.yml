name: acs-webapp

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: acs-server
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/access-control-system}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-to-a-random-32-char-secret!!}
      BIOMETRIC_API_URL: http://biometric-api:8000
      ADMIN_SETUP_SECRET: ${ADMIN_SETUP_SECRET:-super-secret-admin-setup-key-123456}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-to-a-safe-internal-secret-key-12345!!}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://biometric.indroic.dev}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://biometric.indroic.dev/api/auth}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      acs-private:
        aliases:
          - server
      dokploy-network:
        aliases:
          - acs-server-public

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: acs-web
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      NEXT_PUBLIC_SERVER_URL: ""
    ports:
      - "3001:3001"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      acs-private:
        aliases:
          - web
      dokploy-network:
        aliases:
          - acs-web-public

  biometric-api:
    build:
      context: .
      dockerfile: apps/biometric-api/Dockerfile
    container_name: acs-biometric
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/access-control-system}
      BETTER_AUTH_URL: http://server:3000/api/auth
      BETTER_AUTH_ISSUER: ${BETTER_AUTH_URL:-https://biometric.indroic.dev/api/auth}
      BETTER_AUTH_AUDIENCE: ${BETTER_AUTH_URL:-https://biometric.indroic.dev/api/auth}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-to-a-safe-internal-secret-key-12345!!}
    volumes:
      - insightface_models:/root/.insightface
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      acs-private:
        aliases:
          - biometric-api
      dokploy-network:
        aliases:
          - acs-biometric-public

volumes:
  insightface_models:

networks:
  acs-private:
    driver: bridge
  dokploy-network:
    external: true

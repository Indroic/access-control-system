name: acs-migrations

services:
  migrate:
    image: node:22-alpine
    container_name: acs-migrate
    working_dir: /monorepo
    command: >
      sh -c "
        corepack enable &&
        pnpm install --filter @access-control-system/db... --frozen-lockfile &&
        pnpm --filter @access-control-system/db db:push
      "
    environment:
      CI: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/access-control-system}
    volumes:
      - .:/monorepo
      - migrate_node_modules:/monorepo/node_modules
    restart: "no"
    networks:
      - dokploy-network

  biometric-migrate:
    build:
      context: .
      dockerfile: apps/biometric-api/Dockerfile
    container_name: acs-biometric-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/access-control-system}
      PYTHONUNBUFFERED: "1"
    command:
      [
        "/app/.venv/bin/alembic",
        "-c", "/app/alembic.ini",
        "upgrade", "head"
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - dokploy-network

volumes:
  migrate_node_modules:

networks:
  dokploy-network:
    external: true
    name: dokploy-network

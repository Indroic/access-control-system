name: acs-migrations

services:
  migrate:
    image: node:22-alpine
    container_name: acs-migrate
    working_dir: /monorepo
    command: >
      sh -c "
        corepack enable &&
        pnpm install --filter @access-control-system/db... --frozen-lockfile &&
        pnpm --filter @access-control-system/db db:push
      "
    environment:
      CI: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@postgres:5432/access-control-system}
    volumes:
      - .:/monorepo
      - migrate_node_modules:/monorepo/node_modules
    restart: "no"
    networks:
      - dokploy-network

  biometric-migrate:
    image: python:3.14
    container_name: acs-biometric-migrate
    working_dir: /app
    command: >
      sh -c "
        apt-get update -qq && apt-get install -y --no-install-recommends build-essential cmake libopenblas-dev liblapack-dev && rm -rf /var/lib/apt/lists/* &&
        pip install --quiet --no-cache-dir uv &&
        uv sync --frozen &&
        uv run alembic upgrade head
      "
    environment:
      SQL_DATABASE_URL: postgresql://postgres:password@postgres:5432/access-control-system
      ASYNC_SQL_DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/access-control-system
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./apps/biometric-api:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - dokploy-network

volumes:
  migrate_node_modules:

networks:
  dokploy-network:
    external: true

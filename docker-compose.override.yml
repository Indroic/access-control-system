# ─── Development overrides ──────────────────────────────────────────────────
# Auto-merged by `docker compose up` with docker-compose.yml.
# Replaces production builds with dev images that volume-mount source for
# hot reload. The base file owns the one-shot migration services; PostgreSQL es
# externo y se inyecta vía la variable de entorno obligatoria DATABASE_URL.
# ────────────────────────────────────────────────────────────────────────────

services:

  # ── Hono backend (tsx watch) ──────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev.server
    image: acs-server:dev
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria (postgresql://usuario:clave@host:5432/db)}
      BETTER_AUTH_SECRET: a-very-safe-development-secret-key-for-better-auth-32-chars-minimum!!
      BETTER_AUTH_URL: http://localhost:3000
      BIOMETRIC_API_URL: http://biometric-api:8000
      CORS_ORIGIN: http://localhost:3001
      ADMIN_SETUP_SECRET: super-secret-admin-setup-key-123456
      INTERNAL_API_KEY: change-me-to-a-safe-internal-secret-key-12345!!
    volumes:
      - .:/monorepo
      - server_node_modules:/monorepo/node_modules
      - server_app_node_modules:/monorepo/apps/server/node_modules
    working_dir: /monorepo
    command: >
      sh -c "
        corepack enable &&
        pnpm install &&
        pnpm --filter server dev
      "

  # ── TanStack Start frontend (vite dev) ─────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev.web
    image: acs-web:dev
    environment:
      NODE_ENV: development
      PORT: 3001
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    volumes:
      - .:/monorepo
      - web_node_modules:/monorepo/node_modules
      - web_app_node_modules:/monorepo/apps/web/node_modules
      # Keep build artefacts out of the bind mount
      - /monorepo/apps/web/dist
      - /monorepo/apps/web/.output
      - /monorepo/apps/web/.tanstack
    working_dir: /monorepo
    command: >
      sh -c "
        corepack enable &&
        pnpm install &&
        pnpm --filter web dev
      "

  # ── Python biometric API (uvicorn --reload) ────────────────────────────────
  biometric-api:
    build:
      context: .
      dockerfile: Dockerfile.dev.biometric
    image: acs-biometric:dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria (postgresql://usuario:clave@host:5432/db)}
      BETTER_AUTH_URL: http://server:3000/api/auth
      BETTER_AUTH_ISSUER: http://localhost:3000
      BETTER_AUTH_AUDIENCE: http://localhost:3000
      INTERNAL_API_KEY: change-me-to-a-safe-internal-secret-key-12345!!
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./apps/biometric-api:/app
      - biometric_venv:/app/.venv
      - insightface_models:/root/.insightface
    working_dir: /app
    command: >
      sh -c "
        uv sync &&
        .venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

# ─── Dev-only volumes ───────────────────────────────────────────────────────
volumes:
  server_node_modules:
  server_app_node_modules:
  web_node_modules:
  web_app_node_modules:
  biometric_venv:
